<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CHAOS BUDDIES v0.4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#8bdcf0;font-family:system-ui;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;color:white;pointer-events:none;text-shadow:0 2px 5px #17213b}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.pill{background:#172846dc;border:1px solid #ffffff55;border-radius:14px;padding:8px 11px;font-size:13px;font-weight:850}#score{font-size:20px;color:#ffdc70}.pad{display:flex;gap:9px;pointer-events:auto}#controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 18px}.ctrl{width:62px;height:62px;border:2px solid #ffffff88;border-radius:18px;background:#172846df;color:white;font-size:24px;font-weight:900;touch-action:none}.act{background:#ffbd50;color:#432d3d}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;background:#101a3277;color:white}.panel{width:min(400px,100%);border:1px solid #ffffff66;border-radius:24px;padding:23px 19px;background:linear-gradient(145deg,#203d68f2,#192440f5)}.panel h1{font-size:36px;line-height:.95;margin:0}.panel p{font-weight:700;line-height:1.45}.main,.choice{border:0;border-radius:14px;background:linear-gradient(135deg,#ffe276,#ff9e50);padding:12px 19px;color:#402b43;font-weight:1000;font-size:15px;margin:4px}.choice{background:#eaf7ff;color:#233653}.choice.selected{outline:3px solid #4de2d0}#pause{position:absolute;right:14px;top:105px;pointer-events:auto;background:#172846dd;color:white;border:1px solid #fff8;border-radius:12px;padding:8px 12px;font-weight:900}#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:1000;color:#ffe16d;opacity:0}#shop{position:absolute;left:50%;top:105px;transform:translateX(-50%);pointer-events:auto;background:#172846dd;color:white;border:1px solid #fff8;border-radius:12px;padding:8px 12px;font-weight:900}
</style></head><body><div id="game"></div><div id="hud"><div class="top"><div class="pill">🏁 CHAOS BUDDIES <span style="color:#4de2d0">v0.4</span><div id="score">0 m</div></div><div class="pill">🪙 <span id="coins">0</span>　🏆 <span id="best">0</span></div></div><button id="pause">Ⅱ</button><button id="shop">🎭 NHÂN VẬT</button><div id="toast"></div><div id="controls"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="pad"><button class="ctrl act" id="slide">↓</button><button class="ctrl act" id="jump">↑</button></div></div></div><div id="overlay"><div class="panel"><div style="font-size:48px">🩵</div><h1>CHAOS BUDDIES<br>v0.4</h1><p>CHỌN BẠN ĐỒNG HÀNH RỒI BẮT ĐẦU CUỘC ĐUA!</p><div id="choices"><button class="choice selected" data-skin="0">🩵 BUBU</button><button class="choice" data-skin="1">🧡 PIPI</button><button class="choice" data-skin="2">💜 ZUZU</button></div><p style="font-size:12px">Hoạt ảnh chạy · nhảy · trượt · té ngã · búa xoay · cổng né</p><button class="main" id="start">CHƠI NGAY ▶</button><p id="load" style="font-size:12px">Đang tải thế giới 3D…</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=s=>document.querySelector(s),host=$('#game');let scene,camera,renderer,clock,hero,body,feet=[],items=[],lane=1,target=1,jy=0,vy=0,duck=0,dist=0,coins=0,best=0,spawnDist=0,state='menu',elapsed=0,toast=0,skin=0,fall=0;
try{best=+(localStorage.getItem('cb04best')||0)}catch(e){}$('#best').textContent=best;
const skinColors=['#35d9c5','#ff963e','#a779ef'];const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.56});const m={belly:mat('#b5fff0'),orange:mat('#ff9b48'),white:mat('#fff'),dark:mat('#24334f'),pink:mat('#ff8da5'),gold:mat('#ffca42'),purple:mat('#855be0'),coral:mat('#ed687c'),road:mat('#8999c6'),edge:mat('#6577ad'),mint:mat(skinColors[0])};
function add(g,ma,p=scene){let o=new THREE.Mesh(g,ma);p.add(o);return o}
function buildHero(){hero=new THREE.Group();scene.add(hero);body=add(new THREE.SphereGeometry(.58,32,24),m.mint,hero);body.scale.set(.88,1.05,.72);body.position.y=.85;let belly=add(new THREE.SphereGeometry(.34,24,18),m.belly,hero);belly.scale.set(1,.9,.25);belly.position.set(0,.72,.4);for(let s of [-1,1]){let eye=add(new THREE.SphereGeometry(.105,18,14),m.white,hero);eye.position.set(s*.19,1.03,.49);let p=add(new THREE.SphereGeometry(.047,14,10),m.dark,hero);p.position.set(s*.19+.02,1.02,.58);let cheek=add(new THREE.SphereGeometry(.08,14,10),m.pink,hero);cheek.scale.set(1,.55,.25);cheek.position.set(s*.38,.75,.42);let foot=add(new THREE.SphereGeometry(.2,14,10),m.orange,hero);foot.scale.set(.8,.55,1);foot.position.set(s*.22,.18,.08);feet.push(foot)}}
function setSkin(n){skin=n;m.mint.color.set(skinColors[n]);document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',+b.dataset.skin===n))}
function build(){scene=new THREE.Scene();scene.background=new THREE.Color('#8bdcf0');scene.fog=new THREE.Fog('#8bdcf0',25,80);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,120);camera.position.set(0,5,8);camera.lookAt(0,1,-5);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight('#eaffff','#526080',2));let sun=new THREE.DirectionalLight('#fff3d6',2.4);sun.position.set(-5,10,7);sun.castShadow=true;scene.add(sun);let floor=add(new THREE.BoxGeometry(8,.25,110),m.road);floor.position.set(0,-.22,-42);for(let x of [-1.35,1.35]){let line=add(new THREE.BoxGeometry(.035,.02,110),m.white);line.position.set(x,-.08,-42)}for(let s of [-1,1]){let rail=add(new THREE.BoxGeometry(.18,.5,110),m.edge);rail.position.set(s*3.9,.05,-42);for(let i=0;i<14;i++){let post=add(new THREE.CylinderGeometry(.12,.16,.8,8),i%2?m.pink:m.orange);post.position.set(s*4,.2,-i*8-3)}}for(let i=0;i<16;i++)for(let s of [-1,1]){let cloud=add(new THREE.SphereGeometry(.6+Math.random()*.4,12,10),m.white);cloud.position.set(s*(5+Math.random()*3),2+Math.random()*3,-i*7-5);cloud.scale.y=.45}buildHero();hero.position.z=2;clock=new THREE.Clock();$('#load').textContent='Thế giới 3D đã sẵn sàng!';animate()}
function obstacle(type,l,z){let g=new THREE.Group();g.position.set((l-1)*1.35,0,z);scene.add(g);if(type==='block'){let b=add(new THREE.BoxGeometry(.9,.95,.8),m.coral,g);b.position.y=.48;b.castShadow=true}else if(type==='bar'){let b=add(new THREE.BoxGeometry(1.15,.18,.24),m.purple,g);b.position.y=1.25}else if(type==='gap'){let b=add(new THREE.BoxGeometry(1.05,.05,1.3),m.dark,g);b.position.y=-.1}else if(type==='gate'){let a=add(new THREE.BoxGeometry(.16,1.55,.2),m.gold,g);a.position.set(-.52,.78,0);let b=add(new THREE.BoxGeometry(.16,1.55,.2),m.gold,g);b.position.set(.52,.78,0);let top=add(new THREE.BoxGeometry(1.2,.16,.22),m.purple,g);top.position.y=1.55}else{let pivot=new THREE.Group();g.add(pivot);pivot.position.y=1.2;let arm=add(new THREE.BoxGeometry(.15,1.5,.18),m.purple,pivot);arm.position.y=-.45;let head=add(new THREE.BoxGeometry(1.05,.55,.65),m.gold,pivot);head.position.y=-1.1;g.userData.pivot=pivot}g.userData={...g.userData,type,lane:l,hit:false};items.push(g)}
function coin(l,z){let g=new THREE.Group();g.position.set((l-1)*1.35,.95,z);scene.add(g);let ring=add(new THREE.TorusGeometry(.25,.075,12,24),m.gold,g);ring.rotation.y=Math.PI/2;g.userData={type:'coin',lane:l,hit:false};items.push(g)}
function spawn(){let l=Math.floor(Math.random()*3),r=Math.random();if(r<.24)coin(l,-48);else obstacle(['block','bar','gap','hammer','gate'][Math.floor(Math.random()*5)],l,-48);spawnDist=dist}
function pop(s){$('#toast').textContent=s;$('#toast').style.opacity=1;toast=.8}
function start(){state='play';dist=coins=elapsed=spawnDist=jy=vy=duck=fall=0;lane=target=1;items.forEach(o=>scene.remove(o));items=[];$('#coins').textContent=0;$('#score').textContent='0 m';$('#overlay').style.display='none';$('#pause').textContent='Ⅱ'}
$('#start').onclick=start;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>setSkin(+b.dataset.skin));$('#shop').onclick=()=>{if(state==='play'){state='pause';$('#overlay').style.display='flex';$('#overlay').innerHTML='<div class="panel"><h1>CHỌN NHÂN VẬT</h1><p>Đổi màu BUBU miễn phí trong bản thử nghiệm</p><button class="choice" id="s0">🩵 BUBU</button><button class="choice" id="s1">🧡 PIPI</button><button class="choice" id="s2">💜 ZUZU</button><p><button class="main" id="back">QUAY LẠI</button></p></div>';[0,1,2].forEach(n=>$('#s'+n).onclick=()=>setSkin(n));$('#back').onclick=()=>{state='play';$('#overlay').style.display='none'}}};
function move(d){if(state==='play')target=Math.max(0,Math.min(2,target+d))}function jump(){if(state==='play'&&jy===0){vy=8.2;pop('BOING!')}}function slide(){if(state==='play')duck=.65}
[['left',()=>move(-1)],['right',()=>move(1)],['jump',jump],['slide',slide]].forEach(([id,fn])=>$('#'+id).addEventListener('pointerdown',e=>{e.preventDefault();fn()}));
function panel(title,desc,label,fn){$('#overlay').style.display='flex';$('#overlay').innerHTML='<div class="panel"><div style="font-size:48px">😵‍💫</div><h1>'+title+'</h1><p>'+desc+'</p><button class="main" id="panelbtn">'+label+'</button></div>';$('#panelbtn').onclick=fn}
function pause(){if(state==='play'){state='pause';panel('TẠM DỪNG','BUBU nghỉ một chút nhé!','TIẾP TỤC ▶',()=>{state='play';$('#overlay').style.display='none';$('#pause').textContent='Ⅱ'});$('#pause').textContent='▶'}}$('#pause').onclick=pause;
function finish(){if(state!=='play')return;state='fall';fall=1;best=Math.max(best,Math.floor(dist*2));try{localStorage.setItem('cb04best',best)}catch(e){}$('#best').textContent=best;panel('BUBU NGÃ RỒI!','Quãng đường: '+Math.floor(dist*2)+' m<br>Vàng: 🪙 '+coins+'<br>Kỷ lục: 🏆 '+best+' m','CHƠI LẠI ↻',()=>{start()})}
function update(dt){if(state==='play'){elapsed+=dt;dist+=dt*6;lane+=(target-lane)*Math.min(1,dt*12);jy+=vy*dt;vy-=19*dt;if(jy<0){jy=0;vy=0}duck=Math.max(0,duck-dt);hero.position.x=(lane-1)*1.35;hero.position.y=jy+(duck?-.22:Math.abs(Math.sin(elapsed*12))*.045);hero.scale.y=duck?.62:1;hero.rotation.z=(target-lane)*-.12;body.rotation.z=Math.sin(elapsed*12)*.035;feet[0].rotation.x=Math.sin(elapsed*13)*.65;feet[1].rotation.x=-Math.sin(elapsed*13)*.65;feet[0].position.y=.18+Math.max(0,Math.sin(elapsed*13))*.12;feet[1].position.y=.18+Math.max(0,-Math.sin(elapsed*13))*.12;camera.position.x+=(hero.position.x*.18-camera.position.x)*dt*2;camera.lookAt(hero.position.x*.12,1,-5);if(dist-spawnDist>6.8)spawn();for(let i=items.length-1;i>=0;i--){let o=items[i];o.position.z+=dt*12;if(o.userData.pivot)o.userData.pivot.rotation.z=Math.sin(elapsed*4)*.75;if(!o.userData.hit&&o.position.z>1.05&&o.position.z<2.95&&o.userData.lane===Math.round(lane)){if(o.userData.type==='coin'){o.userData.hit=true;coins++;$('#coins').textContent=coins;pop('🪙 +1 VÀNG!')}else{let t=o.userData.type,safe=t==='block'?jy>1.05:t==='bar'?duck>.15:t==='gap'?jy>1.25:t==='gate'?false:jy>1.5||duck>.2;if(safe){o.userData.hit=true;pop('NÉ ĐẸP! ✨')}else finish()}}if(o.position.z>9){scene.remove(o);items.splice(i,1)}}$('#score').textContent=Math.floor(dist*2)+' m';if(toast>0){toast-=dt;if(toast<=0)$('#toast').style.opacity=0}}else if(state==='fall'){hero.rotation.z+=(1.25-hero.rotation.z)*Math.min(1,dt*5);hero.position.y-=dt*.8}}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);update(dt);if(renderer)renderer.render(scene,camera)}
window.addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='ArrowDown')slide();if(e.key==='Escape')pause()});
try{build()}catch(e){$('#load').textContent='Lỗi khởi tạo 3D: '+e.message;console.error(e)}
</script></body></html>
